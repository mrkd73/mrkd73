services:
  mongodb:
    image: mongo:6.0
    container_name: rocketchat-mongodb
    restart: unless-stopped
    network_mode: host
    volumes:
      - mongodb_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]

  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:6.13.0
    container_name: rocketchat-app
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mongodb
    environment:
      ROOT_URL: http://localhost:3000
      PORT: 3000
      MONGO_URL: mongodb://127.0.0.1:27017/rocketchat?replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://127.0.0.1:27017/local?replicaSet=rs0
      DEPLOY_METHOD: docker
      OVERWRITE_SETTING_Site_Url: http://localhost:3000

volumes:
  mongodb_data:
